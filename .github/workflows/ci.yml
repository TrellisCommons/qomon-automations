# Lint, typecheck, test, and build every workspace package. The qomon-client
# contract suite runs against its in-memory fake only (no network); the
# automations DB tests run against a Postgres 17 service container.
name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qomon
          POSTGRES_PASSWORD: qomon
          POSTGRES_DB: qomon_automations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qomon -d qomon_automations_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://qomon:qomon@localhost:5432/qomon_automations_test?schema=public
      TURBO_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: lint · typecheck · test · build
        run: pnpm turbo run lint typecheck test build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the job image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: job
          push: false
      - name: Build the tools (migrate) image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: false
      - name: Compose file is valid
        run: |
          sudo mkdir -p /etc/qomon-automations && sudo touch /etc/qomon-automations/.env
          POSTGRES_PASSWORD=ci docker compose config --quiet
